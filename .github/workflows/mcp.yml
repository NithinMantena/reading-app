name: Test Reading MCP

on:
  push:
    branches: [main]
    paths: ['mcp/**', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['mcp/**', '.github/workflows/mcp.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: docker build --tag reading-app-mcp:test .
