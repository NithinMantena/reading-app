name: Deploy backend (Supabase)

# Applies migrations and deploys the Edge Functions. Requires repository secrets:
#   SUPABASE_ACCESS_TOKEN  (personal access token from supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   (the project's reference id)
#   SUPABASE_DB_PASSWORD   (database password chosen at project creation)
# Optional provider secrets (forwarded to the functions only when present):
#   ANTHROPIC_API_KEY, EXA_API_KEY, BRAVE_API_KEY, OPENALEX_MAILTO

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$REF" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase secrets not set; skipping backend deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.configured == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Push migrations
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
      - name: Set non-sensitive function config
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            APP_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            OWNER_GITHUB_LOGIN="${{ github.repository_owner }}"
      - name: Forward provider secrets that are present
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: |
          args=()
          [ -n "$ANTHROPIC_API_KEY" ] && args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
          [ -n "$EXA_API_KEY" ] && args+=("EXA_API_KEY=$EXA_API_KEY")
          [ -n "$BRAVE_API_KEY" ] && args+=("BRAVE_API_KEY=$BRAVE_API_KEY")
          [ -n "$OPENALEX_MAILTO" ] && args+=("OPENALEX_MAILTO=$OPENALEX_MAILTO")
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" "${args[@]}"
            echo "Forwarded ${#args[@]} provider secret(s)."
          else
            echo "::notice::No provider secrets set; generation will report 'no model provider' until ANTHROPIC_API_KEY is added."
          fi
      - name: Deploy functions
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy api --no-verify-jwt --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy worker --no-verify-jwt --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
