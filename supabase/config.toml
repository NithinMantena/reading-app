project_id = "reading-app"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://nithinmantena.github.io/reading-app", "https://nithinmantena.github.io/reading-app/"]
jwt_expiry = 3600
enable_signup = true

[auth.external.github]
enabled = true
client_id = "env(GITHUB_OAUTH_CLIENT_ID)"
secret = "env(GITHUB_OAUTH_CLIENT_SECRET)"

[functions.api]
# Custom integration tokens are verified inside the function.
verify_jwt = false
